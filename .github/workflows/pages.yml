name: Deploy Pages

on:
  push:
    branches: ['master']
  # 支持手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写入 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，但不取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建示例页面
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # 注入 GitHub Pages 的 base 路径（仓库名），避免静态资源 404
      - name: 构建示例页面
        run: pnpm build:pages --base=/${{ github.event.repository.name }}/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
